<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#08080f" rx="6"/>

  <!-- PCB trace: horizontal run left, drops down, horizontal run right -->
  <polyline
    points="7,11 16,11 16,21 25,21"
    fill="none"
    stroke="#d0d4dc"
    stroke-width="1.5"
    stroke-linecap="square"
  />

  <!-- nodes at each joint/terminal -->
  <rect x="5.25" y="9.25" width="3.5" height="3.5" fill="#d0d4dc"/>
  <rect x="14.25" y="9.25" width="3.5" height="3.5" fill="#d0d4dc"/>
  <rect x="14.25" y="19.25" width="3.5" height="3.5" fill="#d0d4dc"/>
  <rect x="23.25" y="19.25" width="3.5" height="3.5" fill="#d0d4dc"/>
</svg>