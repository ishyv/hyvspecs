[package]
name = "hyvspecs-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hyvspecs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
nvml-wrapper = "0.12.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }
wmi = "0.18.4"
